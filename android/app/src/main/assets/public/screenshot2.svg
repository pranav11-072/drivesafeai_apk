<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1136" width="640" height="1136">
  <!-- Dark Background -->
  <rect width="640" height="1136" fill="#0f172a" />
  
  <!-- Mobile Header -->
  <rect width="640" height="80" fill="#1e293b" />
  <circle cx="50" cy="40" r="20" fill="#2563eb" />
  <text x="85" y="48" font-family="sans-serif" font-size="22" font-weight="bold" fill="#ffffff">DriveSafe AI</text>
  <rect x="460" y="24" width="140" height="32" rx="16" fill="#16a34a" />
  <text x="530" y="45" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ACTIVE HUD</text>

  <!-- Mobile Camera Frame View -->
  <rect x="24" y="104" width="592" height="520" rx="20" fill="#020617" stroke="#334155" stroke-width="2" />
  <!-- Face Tracking Frame -->
  <rect x="140" y="160" width="360" height="400" rx="16" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="10 10" />
  <!-- Reticles -->
  <path d="M140 190 V160 H170" fill="none" stroke="#38bdf8" stroke-width="6" />
  <path d="M500 190 V160 H470" fill="none" stroke="#38bdf8" stroke-width="6" />
  <path d="M140 530 V560 H170" fill="none" stroke="#38bdf8" stroke-width="6" />
  <path d="M500 530 V560 H470" fill="none" stroke="#38bdf8" stroke-width="6" />

  <circle cx="250" cy="310" r="18" fill="none" stroke="#38bdf8" stroke-width="3" />
  <circle cx="250" cy="310" r="6" fill="#38bdf8" />
  <circle cx="390" cy="310" r="18" fill="none" stroke="#38bdf8" stroke-width="3" />
  <circle cx="390" cy="310" r="6" fill="#38bdf8" />

  <rect x="44" y="124" width="220" height="36" rx="10" fill="#0f172a" opacity="0.9" />
  <text x="60" y="148" font-family="monospace" font-size="14" font-weight="bold" fill="#4ade80">● FACE TRACKED</text>

  <!-- Stats Grid -->
  <rect x="24" y="648" width="280" height="130" rx="16" fill="#1e293b" />
  <text x="48" y="684" font-family="sans-serif" font-size="14" fill="#94a3b8">SAFETY SCORE</text>
  <text x="48" y="740" font-family="sans-serif" font-size="42" font-weight="bold" fill="#4ade80">98%</text>

  <rect x="336" y="648" width="280" height="130" rx="16" fill="#1e293b" />
  <text x="360" y="684" font-family="sans-serif" font-size="14" fill="#94a3b8">FATIGUE LEVEL</text>
  <text x="360" y="740" font-family="sans-serif" font-size="42" font-weight="bold" fill="#38bdf8">12%</text>

  <!-- AI Observation Box -->
  <rect x="24" y="802" width="592" height="160" rx="16" fill="#1e293b" stroke="#3b82f6" stroke-width="2" />
  <text x="56" y="842" font-family="sans-serif" font-size="18" font-weight="bold" fill="#60a5fa">✦ Gemini Vision AI Status</text>
  <text x="56" y="880" font-family="sans-serif" font-size="16" fill="#f1f5f9">Driver posture is upright. Blink rate normal.</text>
  <text x="56" y="910" font-family="sans-serif" font-size="16" fill="#f1f5f9">No drowsiness or distraction detected.</text>

  <!-- SOS Button -->
  <rect x="24" y="986" width="592" height="110" rx="20" fill="#dc2626" />
  <text x="320" y="1050" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">EMERGENCY SOS DISPATCH</text>
</svg>
